<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" width="840" height="700" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <marker id="inc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="840" height="700" fill="#ffffff"/>
  <text x="420" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">UML Use Case Diagram: Inventory Management System</text>

  <!-- System boundary -->
  <rect x="230" y="40" width="580" height="630" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="520" y="62" text-anchor="middle" font-weight="bold">Inventory Management System</text>

  <!-- Actor -->
  <circle cx="110" cy="310" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="322" x2="110" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="334" x2="130" y2="334" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="360" x2="92" y2="388" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="360" x2="128" y2="388" stroke="#333" stroke-width="2"/>
  <text x="110" y="410" text-anchor="middle" font-weight="bold">Shop User</text>

  <!-- Associations (actor to use cases) -->
  <g stroke="#333" stroke-width="1.3" fill="none">
    <line x1="130" y1="340" x2="270" y2="105"/>
    <line x1="130" y1="340" x2="270" y2="175"/>
    <line x1="130" y1="340" x2="270" y2="245"/>
    <line x1="130" y1="340" x2="270" y2="315"/>
    <line x1="130" y1="340" x2="270" y2="385"/>
    <line x1="130" y1="340" x2="270" y2="455"/>
    <line x1="130" y1="340" x2="270" y2="525"/>
    <line x1="130" y1="340" x2="270" y2="595"/>
  </g>

  <!-- Use cases -->
  <g fill="#dae8fc" stroke="#6c8ebf" stroke-width="2">
    <ellipse cx="390" cy="105" rx="120" ry="26"/>
    <ellipse cx="390" cy="175" rx="120" ry="26"/>
    <ellipse cx="390" cy="245" rx="120" ry="26"/>
    <ellipse cx="390" cy="315" rx="120" ry="26"/>
    <ellipse cx="390" cy="385" rx="120" ry="26"/>
    <ellipse cx="390" cy="455" rx="120" ry="26"/>
    <ellipse cx="390" cy="525" rx="120" ry="26"/>
    <ellipse cx="390" cy="595" rx="120" ry="26"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="390" y="110">Add product</text>
    <text x="390" y="180">Update product</text>
    <text x="390" y="250">Delete product</text>
    <text x="390" y="320">Search product</text>
    <text x="390" y="390">Record sale</text>
    <text x="390" y="460">View low-stock items</text>
    <text x="390" y="530">Calculate inventory value</text>
    <text x="390" y="600">View dashboard</text>
  </g>

  <!-- Included use case -->
  <ellipse cx="700" cy="385" rx="95" ry="30" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="700" y="382" text-anchor="middle">Check stock</text>
  <text x="700" y="400" text-anchor="middle">availability</text>

  <!-- «include» -->
  <line x1="510" y1="385" x2="605" y2="385" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#inc)"/>
  <text x="557" y="376" text-anchor="middle" font-size="11" font-style="italic">«include»</text>
</svg>
